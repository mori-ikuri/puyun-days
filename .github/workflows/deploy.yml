name: Deploy to GitHub Pages

on:
  # main ブランチに push したときに実行
  push:
    branches: [main]
  # GitHub の Actions タブから手動でも実行できる
  workflow_dispatch:
  # 他のワークフロー（sync-articles.yml）から呼び出して公開できる
  workflow_call:
    inputs:
      ref:
        description: '公開するコミット（省略時は実行したコミット）'
        type: string
        required: false

# 既定では権限なし。必要な権限はジョブごとに付ける
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # push / 手動実行のときは空 = いつもどおり、そのコミットを使う
          ref: ${{ inputs.ref }}
      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # 同時に複数のデプロイが走らないようにする
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
